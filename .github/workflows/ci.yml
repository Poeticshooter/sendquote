name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_SUPABASE_URL: "https://yabsujbilznpoayueokq.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhYnN1amJpbHpucG9heXVlb2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjk2MjksImV4cCI6MjA5NTgwNTYyOX0.huAzUKZ5Q8N7I03yE0jMcps2CiDX8oyFcG_sh4w-Z2E"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Check for known vulnerabilities (advisory only)
        run: pnpm audit --audit-level=critical || echo "::warning::pnpm audit found critical or higher vulnerabilities. Review manually."
